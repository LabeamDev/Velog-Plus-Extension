<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Velog Plus</h1>

    <section id="widthOptions">
      <label class="row">
        <span>본문 폭 넓히기</span>
        <input id="enabled" type="checkbox" />
      </label>

      <div class="row">
        <input id="range" type="range" min="480" max="2400" step="10" />
        <input id="number" type="number" min="480" max="2400" step="10" />
        <span class="unit">px</span>
      </div>

      <div class="presets">
        <button data-width="768">768 (원래)</button>
        <button data-width="1024">1024</button>
        <button data-width="1280">1280</button>
        <button data-width="1600">1600</button>
      </div>
    </section>

    <section>
      <h2>강조 단축키 <kbd id="shortcut">⌘E</kbd></h2>
      <p class="hint">선택한 글자가 설정과 같으면 강조를 해제합니다. 다르면 적용하며 굵게·기울임·밑줄은 체크한 항목만 남깁니다.</p>

      <label class="row">
        <span><input id="hlColorOn" type="checkbox" /> 글자색</span>
        <input id="hlColor" type="color" aria-label="강조 글자색" />
      </label>

      <label class="row">
        <span><input id="hlBgOn" type="checkbox" /> 배경색</span>
        <input id="hlBg" type="color" aria-label="강조 배경색" />
      </label>

      <div class="row">
        <label class="sub" for="hlBgAlpha">배경 불투명도</label>
        <input id="hlBgAlpha" type="range" min="5" max="100" step="5" />
        <span id="hlBgAlphaValue" class="unit"></span>
      </div>

      <div class="row">
        <label><input id="hlBold" type="checkbox" /> 굵게</label>
        <label><input id="hlItalic" type="checkbox" /> 기울임</label>
        <label><input id="hlUnderline" type="checkbox" /> 밑줄</label>
      </div>

      <div class="preview-box">
        <span class="sample">일반 글자 <span id="hlPreview">강조된 글자</span> 일반 글자</span>
      </div>
    </section>

    <section>
      <button id="help" class="help">사용법 보기</button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
